<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200, initial-scale=1">
  <title>XR Probe — Social Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    body {
      position: relative;
      color: #f7fbff;
      font-family: "Space Grotesk", sans-serif;
      background:
        radial-gradient(circle at 16% 52%, rgba(115, 74, 255, .25), transparent 37%),
        radial-gradient(circle at 88% 8%, rgba(36, 218, 196, .19), transparent 34%),
        #060810;
    }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .72; }
    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(143, 166, 211, .045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(143, 166, 211, .045) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(90deg, transparent 12%, black 72%, transparent);
    }
    .frame {
      position: absolute;
      inset: 25px;
      border: 1px solid rgba(184, 204, 255, .13);
      border-radius: 28px;
    }
    .content { position: absolute; left: 74px; top: 75px; z-index: 2; width: 670px; }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 9px 15px;
      border: 1px solid rgba(93, 233, 215, .38);
      border-radius: 999px;
      color: #88f5e6;
      background: rgba(11, 33, 43, .54);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .tag::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #5de9d7;
      box-shadow: 0 0 16px #5de9d7;
    }
    h1 {
      margin: 30px 0 16px;
      font-size: 96px;
      line-height: .92;
      letter-spacing: -.075em;
      font-weight: 700;
      background: linear-gradient(130deg, #fff 20%, #a5d8ff 55%, #9b8cff 90%);
      -webkit-background-clip: text;
      color: transparent;
    }
    .tagline {
      max-width: 610px;
      margin: 0;
      color: #b8c7df;
      font-size: 27px;
      line-height: 1.28;
      letter-spacing: -.02em;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      margin-top: 30px;
      padding: 12px 17px;
      border: 1px solid rgba(165, 216, 255, .22);
      border-radius: 12px;
      background: rgba(7, 12, 26, .7);
      color: #d6e9ff;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 16px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .25);
    }
    .pill span { color: #5de9d7; margin-right: 10px; }
    .visual { position: absolute; right: 47px; top: 55px; width: 425px; height: 490px; z-index: 2; }
    .orb {
      position: absolute;
      left: 48px;
      top: 37px;
      width: 340px;
      height: 340px;
      border-radius: 50%;
      border: 1px solid rgba(150, 181, 255, .18);
      background: radial-gradient(circle at 50% 47%, rgba(42, 60, 107, .52), rgba(11, 14, 30, .18) 62%, transparent 64%);
      box-shadow: inset 0 0 70px rgba(105, 83, 255, .13), 0 0 100px rgba(60, 218, 205, .06);
    }
    .scan { position: absolute; inset: 0; }
    .scan::before, .scan::after {
      content: "";
      position: absolute;
      left: 53px;
      width: 328px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(93, 233, 215, .38), transparent);
    }
    .scan::before { top: 118px; transform: rotate(-9deg); }
    .scan::after { top: 290px; transform: rotate(8deg); }
    .headset {
      position: absolute;
      left: 92px;
      top: 142px;
      width: 257px;
      height: 122px;
      border: 2px solid rgba(201, 223, 255, .82);
      border-radius: 43px 43px 65px 65px;
      background: linear-gradient(155deg, rgba(103, 125, 185, .24), rgba(18, 24, 49, .74));
      box-shadow: 0 0 35px rgba(116, 105, 255, .26), inset 0 0 32px rgba(86, 222, 218, .07);
    }
    .headset::before, .headset::after {
      content: "";
      position: absolute;
      top: 37px;
      width: 58px;
      height: 43px;
      border: 1px solid rgba(110, 237, 224, .52);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(93, 233, 215, .24), transparent 66%);
    }
    .headset::before { left: 52px; }
    .headset::after { right: 52px; }
    .bridge { position: absolute; left: 203px; top: 197px; width: 34px; height: 2px; background: #9b8cff; box-shadow: 0 0 10px #9b8cff; }
    .ray { position: absolute; top: 202px; width: 112px; height: 1px; transform-origin: center; background: linear-gradient(90deg, transparent, #5de9d7); opacity: .62; }
    .ray.a { left: 5px; transform: rotate(21deg); }
    .ray.b { left: 5px; transform: rotate(-21deg); }
    .ray.c { right: -1px; transform: rotate(159deg); }
    .ray.d { right: -1px; transform: rotate(201deg); }
    .telemetry {
      position: absolute;
      left: 77px;
      top: 342px;
      width: 292px;
      padding: 16px 18px 14px;
      border: 1px solid rgba(123, 154, 226, .33);
      border-radius: 14px;
      background: rgba(6, 10, 22, .88);
      box-shadow: 0 20px 60px rgba(0, 0, 0, .42);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #9fb2d0;
      font-size: 12px;
      line-height: 1.65;
    }
    .telemetry strong { color: #edf5ff; font-weight: 600; }
    .telemetry em { color: #5de9d7; font-style: normal; }
    .telemetry i { color: #b49cff; font-style: normal; }
    footer {
      position: absolute;
      z-index: 3;
      left: 74px;
      right: 74px;
      bottom: 48px;
      display: flex;
      justify-content: space-between;
      color: #7183a2;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    footer .brand { color: #aab9d0; margin: 0; }
  </style>
</head>
<body>
  <canvas id="stars"></canvas>
  <div class="grid"></div>
  <div class="frame"></div>
  <main class="content">
    <div class="tag">WebXR field diagnostic</div>
    <h1>XR<br>Probe</h1>
    <p class="tagline">See what a headset browser actually exposes.</p>
    <div class="pill"><span>●</span> ibrews.github.io/xr-probe</div>
  </main>
  <section class="visual" aria-hidden="true">
    <div class="orb"></div>
    <div class="scan"></div>
    <div class="ray a"></div><div class="ray b"></div><div class="ray c"></div><div class="ray d"></div>
    <div class="headset"></div><div class="bridge"></div>
    <div class="telemetry">
      <strong>SESSION</strong>&nbsp; immersive-vr<br>
      <strong>VIEWS</strong>&nbsp;&nbsp;&nbsp; left · right<br>
      <strong>INPUT</strong>&nbsp;&nbsp;&nbsp; <em>hands detected</em><br>
      <strong>FOV</strong>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 96.4° binocular<br>
      <strong>FEATURES</strong>&nbsp; <i>live snapshot</i>
    </div>
  </section>
  <footer>
    <span class="brand">Alex Coulombe Presents</span>
    <span>FOV · INPUT · FRAME RATE · FEATURES</span>
  </footer>
  <script>
    const canvas = document.querySelector('#stars');
    const context = canvas.getContext('2d');
    canvas.width = 1200;
    canvas.height = 630;
    const random = mulberry32(7319);
    for (let index = 0; index < 118; index += 1) {
      const x = random() * canvas.width;
      const y = random() * canvas.height;
      const radius = .35 + random() * 1.25;
      context.beginPath();
      context.arc(x, y, radius, 0, Math.PI * 2);
      context.fillStyle = `rgba(${random() > .84 ? '116,238,222' : '205,218,255'},${.12 + random() * .55})`;
      context.fill();
    }
    function mulberry32(seed) {
      return function randomNumber() {
        let value = seed += 0x6D2B79F5;
        value = Math.imul(value ^ value >>> 15, value | 1);
        value ^= value + Math.imul(value ^ value >>> 7, value | 61);
        return ((value ^ value >>> 14) >>> 0) / 4294967296;
      };
    }
  </script>
</body>
</html>
